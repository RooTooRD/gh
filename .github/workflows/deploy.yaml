name: Reusable Mise Deploy Workflow

on:
  workflow_call:
    secrets:
      GITHUB_TOKEN:
        required: true

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    env:
      UV_CACHE_DIR: /tmp/.uv-cache
    concurrency:
      group: ${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - name: pnpm cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: uv cache
        uses: actions/cache@v4
        if: hashFiles('uv.lock') != ''
        with:
          path: /tmp/.uv-cache
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
            uv-${{ runner.os }}

      - uses: jdx/mise-action@v2
        with:
          experimental: true

      - name: Setup .npmrc for GitHub Packages
        run: |
          echo "@${{ github.repository_owner }}:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc
          echo "@nuqayah:registry=https://npm.pkg.github.com" >> .npmrc

      - name: Deploy (mise task)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: "--max_old_space_size=4096"
        run: |
          perl -i -pe 's/(python.uv_venv_auto =) true/$1 false/' mise.toml
          mise run deploy

      - name: Minimize uv cache
        if: hashFiles('uv.lock') != '' && success()
        run: command -v uv &>/dev/null && uv cache prune --ci || true
